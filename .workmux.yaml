# workmux for nixos-config. Shared settings: ~/.config/workmux/config.yaml

# This repo is a flake, and `nix build` sees only files in the git index.
# An unstaged .nix file is invisible to the build — it passes silently with the
# old content instead of reporting an error. A gate, not a report: it blocks merge.
pre_merge:
  - 'test -z "$(git ls-files --others --exclude-standard -- "*.nix")" || { echo "unstaged .nix files — nix build will not see them"; exit 1; }'

windows:
  - name: agent
    panes:
      - command: <agent>
        focus: true
